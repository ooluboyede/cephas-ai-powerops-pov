name: PoV CI

on:
  push:
    branches: [main, 'gate/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d powerops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POWEROPS_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/powerops_test
      POWEROPS_PG_APP_URL: postgres://powerops_app:powerops_app_test_password@localhost:5432/powerops_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install PostgreSQL test driver
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Run PoV boundary, unit and PostgreSQL integration tests
        run: npm test
